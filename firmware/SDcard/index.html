<!DOCTYPE html>
<html>

<head>
  <title>Gen3 ESP32 dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" resolution="1280x720">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="icon" href="data:,">
</head>

<body>

  <div class="content">
    <div class="header">
      <div class="trip">
        <svg class="ikona-small">
          <use xlink:href="graphics.svg#put"></use>
        </svg>
        &nbsp;<span id="tripKm">0</span></br>
        <svg class="ikona-small">
          <use xlink:href="graphics.svg#sat"></use>
        </svg>
        &nbsp;<span id="timeHM">00:00</span>
      </div>
      <div class="logo">
        <svg id="prius" width="420" height="70">
          <use xlink:href="graphics.svg#prius"></use>
        </svg>
      </div>
      <div class="odom">
        <svg class="ikona-small">
          <use xlink:href="graphics.svg#satelitska"></use>
        </svg>
        &nbsp;<span id="numSat">0</span><br>
        <svg class="ikona-small">
          <use xlink:href="graphics.svg#autoBok"></use>
        </svg>...<svg class="ikona-small">
          <use xlink:href="graphics.svg#pumpa"></use>
        </svg>
        &nbsp;
        <span id="dte">&#8734;</span>
      </div>
    </div>

    <div class="card-grid">
      <div class="card">
        <p class="card-title"><svg class="ikona">
            <use xlink:href="graphics.svg#pumpa"></use>
          </svg><svg class="ikona">
            <use xlink:href="graphics.svg#put"></use>
          </svg></p>
        <canvas id="gauge-avCons"></canvas>
      </div>
      <div class="card">
        <p class="card-title"><svg class="ikona">
            <use xlink:href="graphics.svg#rpm"></use>
          </svg></p>
        <canvas id="gauge-rpm"></canvas>
      </div>
      <div class="card">
        <p class="card-title"><svg class="ikona">
            <use xlink:href="graphics.svg#levo"></use>
          </svg><svg class="ikona">
            <use xlink:href="graphics.svg#pumpa"></use>
          </svg></p>&nbsp;&nbsp;
        <canvas id="gauge-tank"></canvas>
      </div>

      <div class="card">
        <p class="card-title"><svg class="ikona">
            <use xlink:href="graphics.svg#munja"></use>
          </svg>
          <svg class="ikona">
            <use xlink:href="graphics.svg#temp"></use>
          </svg>
        </p>
        <canvas id="gauge-inverertertemp"></canvas>
      </div>

      <div class="card">
        <p class="card-title"><svg class="ikona">
            <use xlink:href="graphics.svg#motor"></use>
          </svg>
          <svg class="ikona">
            <use xlink:href="graphics.svg#temp"></use>
          </svg>
        </p>
        <canvas id="gauge-temperature"></canvas>
      </div>
    </div>

    <div class="card-grid">
      <div class="card2">
        &nbsp;&nbsp;&nbsp;<button id="resetAvSpeed" class="button">
          <div class="icons-row">
            <svg class="ikona-smallV">
              <use xlink:href="graphics.svg#crne"></use>
            </svg>
          </div>
          <span class="button-text">#</span>
        </button>
        <div class="text-container">
          <span id="avSpeed">0</span>
          <span id="avSpeedR"></span>
        </div>
      </div>
      <div class="card2">
        <div class="text-container">
          <span id="ccSpeed"> km/h</span>
        </div>
      </div>
      <div class="card2">
        <div class="text-container">
          <div class="card3">
            <span id="speed">0</span>
          </div>
        </div>
      </div>
      <div class="card">
        <canvas id="gauge-angle"></canvas>
      </div>
      <div class="card4">
        <svg class="ikona-small">
          <use xlink:href="graphics.svg#auto"></use>
        </svg>
        <span id="tempRoomC">0</span>°C
      </div>
    </div>
  </div>
    <div class="debug">
    </br>
  </div>
  <div id="debugText" class="debug">
    V 1.1
  </div>
  <script src="script.js"></script>
</body>

</html>
